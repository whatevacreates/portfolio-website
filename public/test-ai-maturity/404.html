    <script>
      // Deep-link restore. On GitHub Pages only the ROOT 404.html answers
      // URLs with no real file behind it; it forwards the original path here
      // as ?p= (URL-encoded). Restore it before the module script boots the
      // router, so /r/<token> and /save/<token> links resolve. The leading-/
      // guard keeps ?p= from ever navigating off-site.
      (function () {
        var p = new URLSearchParams(location.search).get('p');
        if (p && p.charAt(0) === '/') history.replaceState(null, '', p);
      })();
    </script>
